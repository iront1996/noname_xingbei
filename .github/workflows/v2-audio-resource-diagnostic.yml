name: V2 background audio resource diagnosis and Chromium regression
on:
  push:
    branches:
      - integration/v2-audio-resource-diagnostic-20261118
permissions:
  contents: read
concurrency:
  group: v2-audio-resource-diagnostic-only
  cancel-in-progress: true
jobs:
  original-native-chromium-audio:
    if: github.repository == 'iront1996/noname_xingbei'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Establish MP3 asset exists and is byte-identical to original Git source
        shell: bash
        run: |
          set -euo pipefail
          path=audio/background/music_default.mp3
          pinned="$(node -p 'require("./ops/v2-sync-state.json").upstream.sha')"
          git fetch --no-tags https://github.com/RancherJie/noname_xingbei.git "$pinned"
          upstream_blob="$(git rev-parse "$pinned:$path")"
          v2_blob="$(git rev-parse "HEAD:$path")"
          test "$upstream_blob" = "$v2_blob"
          test "$(git cat-file -s "$v2_blob")" -gt 1024
          file --mime-type "$path"
          printf 'V2_BGM_ORIGINAL_GIT_IDENTITY_PASS blob=%s bytes=%s\n' "$v2_blob" "$(git cat-file -s "$v2_blob")"
      - name: Install disposable Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2-playwright
          npm install --prefix /tmp/v2-playwright --no-package-lock --no-save playwright@1.56.1
          node /tmp/v2-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: Start loopback-only Python HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/v2-audio-http.log 2>&1 &
          echo "$!" >/tmp/v2-audio-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/audio/background/music_default.mp3 -o /tmp/v2-bgm-get.mp3; then break; fi
            sleep 1
          done
          test -s /tmp/v2-bgm-get.mp3
          cmp -s audio/background/music_default.mp3 /tmp/v2-bgm-get.mp3
          curl -sS -D /tmp/v2-bgm-range.headers -H 'Range: bytes=0-2047' http://127.0.0.1:8765/audio/background/music_default.mp3 -o /tmp/v2-bgm-range.mp3
          printf 'V2_BGM_FULL_HTTP_BYTES_PASS\n'
          head -n 14 /tmp/v2-bgm-range.headers
      - name: Native Chromium UI and cache with precise background music network trace
        run: node tests/v2-original-ui-chromium.mjs
      - name: Stop loopback server
        if: always()
        run: |
          if test -f /tmp/v2-audio-server.pid; then kill "$(cat /tmp/v2-audio-server.pid)" || true; fi
      - name: Prepare latest official release in disposable CI worktree
        env:
          V2_SYNC_DISPOSABLE: '1'
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/RancherJie/noname_xingbei.git refs/heads/master | cut -f1)"
          test "$(printf '%s' "$latest" | wc -c)" -eq 40
          git fetch --no-tags https://github.com/RancherJie/noname_xingbei.git "$latest"
          name="v2-sync-candidate-$(printf '%s' "$latest" | cut -c1-12)-2026111808"
          git worktree add -b "$name" /tmp/v2-latest-official HEAD
          (
            cd /tmp/v2-latest-official
            git config user.name 'V2 CI Only'
            git config user.email 'v2-ci@users.noreply.github.com'
            node tools/v2-upstream-sync.mjs --prepare "$latest"
            node tools/v2-upstream-sync.mjs --verify "$latest"
            node tools/sync-image-manifest.mjs --check
            test -z "$(git status --porcelain)"
            old="$(node -p 'require("./ops/v2-sync-state.json").previousUpstreamSha')"
            git diff --name-only "$old" "$latest" > /tmp/v2-changed-original-files.txt
            grep -q -E '^(character/|noname/library/)' /tmp/v2-changed-original-files.txt
            echo 'V2_LATEST_SOURCE_INHERITANCE_AND_MANUAL_REVIEW_REQUIRED_PASS'
          )
          mkdir -p /tmp/v2-original-source
          git -C /tmp/v2-original-source init --quiet
          git -C /tmp/v2-original-source fetch --depth 1 https://github.com/RancherJie/noname_xingbei.git "$latest"
          git -C /tmp/v2-original-source checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/v2-original-source rev-parse HEAD)" = "$latest"
      - name: Start isolated newest-original V2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory /tmp/v2-latest-official > /tmp/v2-latest-http.log 2>&1 &
          echo "$!" > /tmp/v2-latest-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/game/update.js > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Full latest V2 original published text parity
        shell: bash
        env:
          V2_AUDIT_BASE_URL: http://127.0.0.1:8765/
        run: |
          set -euo pipefail
          cd /tmp/v2-latest-official
          node tests/v2-public-site-audit.mjs
      - name: Full latest V2 Chromium native modes Hall default cache and BGM integrity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v2-latest-official
          node tests/v2-original-ui-chromium.mjs
      - name: Full latest V2 Chromium original/extension/UI regression
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v2-latest-official
          node tests/v2-live-original-ui-regression.mjs
          echo 'V2_FULL_LATEST_PUBLISHED_UI_EXTENSION_CACHE_REGRESSION_PASS'
      - name: Stop newest-original loopback HTTP server
        if: always()
        run: |
          if test -f /tmp/v2-latest-http.pid; then kill "$(cat /tmp/v2-latest-http.pid)" || true; fi
      - name: Archive V2-only HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-audio-http-evidence
          path: |
            /tmp/v2-bgm-range.headers
            /tmp/v2-audio-http.log
            /tmp/v2-latest-http.log
            /tmp/v2-latest-official/artifacts/v2-live-ui/
          if-no-files-found: ignore
