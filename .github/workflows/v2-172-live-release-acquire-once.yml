name: V2 isolated official v1.7.2 source and extension acquisition (one-time)
on:
  push:
    branches:
      - integration/v2-172-public-tutorial-reconcile-20261120
permissions:
  contents: write
jobs:
  read-official-runtime:
    if: github.repository == 'iront1996/noname_xingbei'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and V2 target are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'integration/v2-172-public-tutorial-reconcile-20261120'
          test "$(git ls-remote https://github.com/RancherJie/noname_xingbei.git refs/heads/master | cut -f1)" = 27ad858dbeea5da35fc434cc226b0302792d2ba3
          test "$(git ls-remote origin refs/heads/feature/image-preload-cache | cut -f1)" = f0510164518037dda1c330849dd6754d10ca1b19
          test "$(node -p 'require("./ops/v2-sync-state.json").upstream.sha')" = 27ad858dbeea5da35fc434cc226b0302792d2ba3
          test -z "$(git status --porcelain)"
      - name: Obtain exactly three newly changed officially released files
        shell: bash
        run: |
          set -euo pipefail
          for p in game/source.js extension/创世纪/extension.js extension/创世纪/info.json; do
            encoded="$(node -e 'process.stdout.write(process.argv[1].split("/").map(encodeURIComponent).join("/"))' "$p")"
            mkdir -p "$(dirname "$p")"
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 40 \
              "https://rancherjie.github.io/noname_xingbei/$encoded?release=$GITHUB_SHA" -o "$p"
            test -s "$p"
            test "$(wc -c < "$p")" -lt 400000
            sha256sum "$p"
          done
          node --check game/source.js
          node --check extension/创世纪/extension.js
          node -e 'const x=require("./extension/创世纪/info.json"); if(x.name!=="创世纪")throw Error("Extension identity mismatch")'
          grep -Fq 'mode/tutorial-scene.js' game/source.js
          grep -Fq 'layout/mode/tutorial.css' game/source.js
          grep -Fq 'game.import("extension"' extension/创世纪/extension.js
          git add -u -- game/source.js extension/创世纪/extension.js extension/创世纪/info.json
          git -c core.quotePath=false diff --cached --name-only | LC_ALL=C sort > /tmp/v2-acquire-changes.txt
          printf '%s\n' extension/创世纪/extension.js extension/创世纪/info.json game/source.js > /tmp/v2-acquire-expected.txt
          diff -u /tmp/v2-acquire-expected.txt /tmp/v2-acquire-changes.txt
          test -z "$(git diff --name-only)"
          echo 'V2_LIVE_ORIGINAL_SOURCE_LIST_AND_EXTENSION_ACQUISITION_PASS'
      - name: Push only isolated V2 candidate contents
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V2 Official Release Integrity'
          git config user.email 'v2-original-source@users.noreply.github.com'
          git commit -m 'sync(v2): inherit exact official released source inventory and extension for review'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'V2_LIVE_RELEASE_DIFF_STAGED_IN_ISOLATION_ONLY'
