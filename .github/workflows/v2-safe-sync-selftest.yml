name: V2 safe auto-sync code and published release self-test
on:
  push:
    branches: [integration/v2-safe-auto-sync-20261117, integration/v2-candidate-branch-fix-20261118]
permissions:
  contents: read
concurrency:
  group: v2-safe-auto-sync-selftest
  cancel-in-progress: true
jobs:
  v2-scoped-selftest:
    if: github.repository == 'iront1996/noname_xingbei'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V2 scheduled candidate naming regression
        run: node tests/v2-candidate-branch-contract.mjs
      - name: Verify optional HTTP 503 review hold and required-source fail-closed behavior
        run: node tests/v2-published-unavailable-contract.mjs
      - name: Syntax and publication manifest schema
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/v2-upstream-sync.mjs
          node --check tools/v2-published-release-sync.mjs
          node --check tests/v2-public-site-audit.mjs
          node --check tests/v2-live-original-ui-regression.mjs
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("ops/v2-official-publication.json","utf8"));
            assert.equal(p.publishedTextOverlays.length,35);
            assert.equal(p.bundledExtensions.length,11);
            for (const path of p.publishedTextOverlays) assert.ok(fs.existsSync(path),path);
            for (const name of p.bundledExtensions) assert.ok(fs.existsSync("extension/"+name+"/extension.js"),name);
            console.log("V2_PUBLICATION_SCHEMA_AND_BUNDLE_PASS");
          '
      - name: Fetch trusted pinned original without changing V2
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(node -p 'require("./ops/v2-sync-state.json").upstream.sha')"
          git fetch --no-tags https://github.com/RancherJie/noname_xingbei.git "$upstream"
          mkdir -p /tmp/v2-original-source
          git -C /tmp/v2-original-source init --quiet
          git -C /tmp/v2-original-source remote add origin https://github.com/RancherJie/noname_xingbei.git
          git -C /tmp/v2-original-source fetch --depth 1 origin "$upstream"
          git -C /tmp/v2-original-source checkout --quiet --detach FETCH_HEAD
          node tools/v2-upstream-sync.mjs --verify "$upstream"
          node tools/sync-image-manifest.mjs --check
          # The current public release can legitimately be newer than the pinned V2.
          # Verify the pinned V2 Git tree above, and test the new public release
          # on its disposable candidate below. Never compare a stale V2 to a new
          # public website and mislabel the expected change as a regression.
          live="$(git ls-remote https://github.com/RancherJie/noname_xingbei.git refs/heads/master | cut -f1)"
          if test "$live" = "$upstream"; then
            node tools/v2-published-release-sync.mjs --check "$upstream" "$upstream"
            echo 'PINNED_LIVE_EQUAL=true' >> "$GITHUB_ENV"
          else
            echo "PINNED_V2_RELEASE_STALE_EXPECTED: pinned=$upstream latest=$live"
            echo 'PINNED_LIVE_EQUAL=false' >> "$GITHUB_ENV"
          fi
      - name: Start local read-only candidate for full published-source comparison
        if: env.PINNED_LIVE_EQUAL == 'true'
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/v2-source-http.log 2>&1 &
          echo "$!" > /tmp/v2-source-http.pid
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/game/update.js > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Assert official published source parity across all tracked text files
        if: env.PINNED_LIVE_EQUAL == 'true'
        env:
          V2_AUDIT_BASE_URL: http://127.0.0.1:8765/
        run: node tests/v2-public-site-audit.mjs
      - name: Stop local source auditor
        if: always()
        run: |
          if test -f /tmp/v2-source-http.pid; then kill "$(cat /tmp/v2-source-http.pid)" || true; fi
      - name: Simulate a future original README-only release on disposable worktree
        if: env.PINNED_LIVE_EQUAL == 'true'
        shell: bash
        env:
          V2_SYNC_DISPOSABLE: '1'
        run: |
          set -euo pipefail
          git -C /tmp/v2-original-source config user.name 'V2 Fixture'
          git -C /tmp/v2-original-source config user.email 'v2-fixture@users.noreply.github.com'
          printf '\nV2 future upstream dry-run only\n' >> /tmp/v2-original-source/README.md
          git -C /tmp/v2-original-source add README.md
          git -C /tmp/v2-original-source commit -m 'test: harmless original README-only update'
          fixture="$(git -C /tmp/v2-original-source rev-parse HEAD)"
          git fetch --no-tags /tmp/v2-original-source "$fixture"
          worktree="/tmp/v2-safe-sync-worktree"
          git worktree add -b "v2-sync-candidate-$(printf '%s' "$fixture" | cut -c1-12)" "$worktree" HEAD
          (
            cd "$worktree"
            git config user.name 'V2 CI'
            git config user.email 'v2-fixture@users.noreply.github.com'
            node tools/v2-upstream-sync.mjs --prepare "$fixture"
            node tools/v2-upstream-sync.mjs --verify "$fixture"
            node tools/sync-image-manifest.mjs --check
            test -z "$(git status --porcelain)"
            test "$(node -p 'require("./ops/v2-sync-state.json").upstream.sha')" = "$fixture"
            echo 'V2_SAFE_PUBLICATION_PRESERVING_PREPARE_PASS'
          )
          git worktree remove --force "$worktree"
      - name: Check newest original's overlay and high-risk review without public-site writes
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote https://github.com/RancherJie/noname_xingbei.git refs/heads/master | cut -f1)"
          test "$(printf '%s' "$latest" | wc -c)" -eq 40
          git fetch --no-tags https://github.com/RancherJie/noname_xingbei.git "$latest"
          name="v2-sync-candidate-$(printf '%s' "$latest" | cut -c1-12)-2026111802"
          node tools/v2-upstream-sync.mjs --check-branch "$name" "$latest"
          mkdir -p /tmp/v2-connect-original/mode
          git show "$latest:mode/connect.js" > /tmp/v2-connect-original/mode/connect.js
          (
            cd /tmp/v2-connect-original
            git apply --check "$GITHUB_WORKSPACE/tools/v2-connect-overlay.patch"
          )
          pinned="$(node -p 'require("./ops/v2-sync-state.json").upstream.sha')"
          if test "$pinned" != "$latest"; then
            git diff --name-only "$pinned" "$latest" > /tmp/v2-rule-diff.txt
            grep -q -E '^character/' /tmp/v2-rule-diff.txt
            grep -q -E '^noname/library/element/player.js$' /tmp/v2-rule-diff.txt
            echo 'V2_UPDATED_ENGINE_SKILL_REVIEW_GATE_PASS'
          else
            echo 'V2_NO_SOURCE_UPDATE_TO_REVIEW'
          fi
      - name: Archive isolated V2 parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-safe-sync-selftest
          path: artifacts/v2-runtime-parity/
          if-no-files-found: ignore
