name: V2 original HALL contract (non-deploy)

on:
  pull_request:
    branches:
      - feature/image-preload-cache
    paths:
      - mode/connect.js
      - game/server.js
      - ops/v2-original-hall/**
      - .github/workflows/v2-original-hall-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify V2 original HALL and endpoint contracts
        run: node --test ops/v2-original-hall/test-contract.mjs
      - name: Verify in-place deploy script and original-source hash
        run: python3 ops/v2-original-hall/deploy-existing-vps.py --self-test
      - name: Check deployment script syntax
        run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('ops/v2-original-hall/deploy-existing-vps.py').read_text())"
      - name: Simulate existing-VPS preflight, replacement and automatic rollback
        run: python3 -m unittest discover -s ops/v2-original-hall -p "test_deploy_existing_vps.py" -v
      - name: Check V2 connect source syntax
        run: node --check mode/connect.js
      - name: Check original HALL source syntax
        run: node --check game/server.js
