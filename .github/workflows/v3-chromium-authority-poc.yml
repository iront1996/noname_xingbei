name: V3 Chromium Authority Worker PoC

on:
  push:
    branches:
      - feature/host-reconnect-v3-playtest
    paths:
      - 'game/v3-chromium-authority-worker.mjs'
      - 'game/v3-native-xingbei-outcome-adapter.mjs'
      - 'game/v3-authority-runtime-coordinator.mjs'
      - 'game/v3-authority-websocket-broker.mjs'
      - 'game/v3-authority-choice-windows.mjs'
      - 'game/v3-native-event-wait-adapter.mjs'
      - 'game/v3-authority-seat-preflight.mjs'
      - 'tools/test-v3-chromium-authority-worker.mjs'
      - 'tools/test-v3-chromium-coordinator-integration.mjs'
      - 'tools/test-v3-authority-websocket-broker.mjs'
      - 'tools/test-v3-real-websocket-chromium-broker.mjs'
      - 'tools/test-v3-real-choice-window-chromium.mjs'
      - 'tools/test-v3-native-gameevent-choice-chromium.mjs'
      - 'tools/test-v3-chromium-sandbox-policy.mjs'
      - 'tools/test-v3-authority-choice-windows.mjs'
      - 'tools/v3-native-module-test-server.mjs'
      - 'tools/test-v3-native-module-chromium.mjs'
      - 'tools/v3-real-native-result-probe.mjs'
      - 'tools/test-v3-native-xingbei-outcome-adapter.mjs'
      - 'tools/v3-native-seat-probe.mjs'
      - 'tools/test-v3-authority-runtime-coordinator.mjs'
      - 'noname/game/index.js'
      - '.github/workflows/v3-chromium-authority-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-offboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chromium experiment sources
        run: |
          node --check game/v3-chromium-authority-worker.mjs
          node --check game/v3-native-xingbei-outcome-adapter.mjs
          node --check game/v3-authority-runtime-coordinator.mjs
          node --check game/v3-authority-websocket-broker.mjs
          node --check game/v3-authority-choice-windows.mjs
          node --check game/v3-native-event-wait-adapter.mjs
          node --check tools/test-v3-chromium-authority-worker.mjs
          node --check tools/test-v3-chromium-coordinator-integration.mjs
          node --check tools/test-v3-real-websocket-chromium-broker.mjs
          node --check tools/test-v3-real-choice-window-chromium.mjs
          node --check tools/test-v3-native-gameevent-choice-chromium.mjs
          node --check tools/test-v3-chromium-sandbox-policy.mjs
          node --check tools/v3-native-module-test-server.mjs
          node --check tools/test-v3-native-module-chromium.mjs
          node --check tools/v3-real-native-result-probe.mjs
          node --check tools/v3-native-seat-probe.mjs
          node --check game/v3-authority-seat-preflight.mjs
      - name: Install isolated WebSocket test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts ws@8.18.3
      - name: Run actual headless Chromium seat and lifecycle experiment
        env:
          V3_ALLOW_SEAT_EXPERIMENT: '1'
        run: |
          set -euo pipefail
          browser=''
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          if [ -z "$browser" ]; then
            echo 'FAIL: runner lacks installed Chromium/Chrome; not a skipped PASS.' >&2
            exit 1
          fi
          V3_CHROMIUM="$browser" node --test tools/test-v3-chromium-authority-worker.mjs tools/test-v3-chromium-coordinator-integration.mjs tools/test-v3-real-websocket-chromium-broker.mjs tools/test-v3-native-module-chromium.mjs tools/test-v3-real-choice-window-chromium.mjs tools/test-v3-native-gameevent-choice-chromium.mjs tools/test-v3-chromium-sandbox-policy.mjs
