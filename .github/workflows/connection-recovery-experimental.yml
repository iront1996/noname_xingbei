name: Experimental connection recovery tests

on:
  push:
    branches:
      - feature/connection-health-recovery
      - feature/v2-connection-stability
  pull_request:
    branches:
      - feature/v2-connection-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client recovery and host choice tests
        run: node --test tests/connection-recovery.mjs tests/connection-recovery-b3.mjs tests/connection-recovery-c1.mjs tests/connection-recovery-c2.mjs tests/connection-recovery-c3.mjs tests/connection-recovery-c3b.mjs tests/connection-recovery-c3c.mjs
      - name: V2 patched HALL WebSocket takeover integration
        run: node --test tests/v2-b2-hall-integration.mjs
      - name: V2 offline preflight and stale lobby close guards
        run: node --test tests/v2-hall-preflight.mjs tests/v2-lobby-stale-close.mjs
      - name: V2 independent HALL liveness and game-progress observer
        run: node --test tests/v2-hall-progress-watch.mjs
      - name: V2 advisory game-progress and stalled-choice diagnostics
        run: node --test tests/v2-progress-audit.mjs
      - name: V2 scoped Xingbei own-seat poison skill recovery
        run: node --test tests/v2-skill-resume.mjs
      - name: V2 snapshot coverage and unsnapshotted GameEvent disclosure
        run: node --test tests/v2-reinit-coverage.mjs
      - name: V2 async snapshot generation and roster structural validation
        run: node --test tests/v2-reinit-async-fence.mjs
      - name: V2 host and guest reinit readiness handshake
        run: node --test tests/v2-host-reinit-handshake.mjs
      - name: V2 seat reclaim and reinit safety gates
        run: node --test tests/v2-recovery-gate.mjs
      - name: V2 server-owned room lifecycle foundation
        run: node --test tests/v2-server-room-lifecycle.mjs
      - name: V2 owner browser recovery protocol
        run: node --test tests/v2-owner-recovery.mjs tests/v2-owner-client-events.mjs
      - name: Install isolated WebSocket test dependency
        run: npm install --prefix "$RUNNER_TEMP/xingbei-ws" --ignore-scripts --no-save ws@8.18.3
      - name: V2 real HALL WebSocket process lifecycle
        env:
          NODE_PATH: ${{ runner.temp }}/xingbei-ws/node_modules
        run: node --test tests/v2-hall-process-integration.mjs
      - name: V2 generated B2 and M1 same-process integration
        env:
          NODE_PATH: ${{ runner.temp }}/xingbei-ws/node_modules
        run: node --test tests/v2-b2-m1-process-integration.mjs
      - name: V2 M2 managed host-session lifecycle and authority boundary
        run: node --test tests/v2-host-session-manager.mjs tests/v2-managed-host-process.mjs tests/v2-managed-choice-controller.mjs
      - name: V2 M2 deterministic choice and host-session race barriers
        run: node --test tests/v2-managed-choice-races.mjs
      - name: V2 M2 real Chromium off-board lifecycle proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" node --test --test-concurrency=1 tests/v2-managed-chromium-host.mjs tests/v2-managed-engine-init.mjs tests/v2-managed-native-event.mjs tests/v2-managed-character-selection.mjs tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native Xingbei opening draw authority Event 3
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          for attempt in 1 2 3; do
            env V2_CHROMIUM="$browser" V2_NATIVE_OPENING_DRAW_EVENT3=1 node --test --test-concurrency=1 tests/v2-managed-native-choice-ipc.mjs
          done
      - name: V2 M2 resume accepted opening root into native phaseLoop input gate
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_OPENING_DRAW_EVENT3=1 V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_opening_root_action node --test --test-concurrency=1 tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 opt-in native start event-stack diagnostics
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=native_start node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 managed native start coordinator proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_start node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 managed native input gate proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_gate node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 managed native input resume proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_resume node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 managed native input deadline proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_timeout node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 managed native input cancellation proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_cancel node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 managed native input stop cleanup proof
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_stop node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native card choice controller player path
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native card choice controller trustee path
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller_trustee node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 F3 native action rebind with managed Seat Registry
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller_registry node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 fail-closed native useResult fault injection
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller_fault_before_apply node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native result-set failure is fail-closed
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller V2_MANAGED_NATIVE_FAULT_INJECTION=before_native_result_set node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 dispatched CDP outcome ambiguity is fail-closed
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller V2_MANAGED_NATIVE_FAULT_INJECTION=cdp_result_unknown_after_dispatch node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native useResult exception is fail-closed
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller V2_MANAGED_NATIVE_FAULT_INJECTION=use_result_throws node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native useCard child failure is fail-closed
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller V2_MANAGED_NATIVE_FAULT_INJECTION=use_card_child_throws node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 same native action delivery retry while applying
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller V2_MANAGED_NATIVE_FAULT_INJECTION=retry_while_applying node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 stale native action delivery after completion is rejected
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          env V2_CHROMIUM="$browser" V2_NATIVE_START_DIAGNOSTICS=1 V2_NATIVE_START_PROBE_MODE=managed_input_controller V2_MANAGED_NATIVE_FAULT_INJECTION=late_stale_delivery node --test tests/v2-managed-native-choice-ipc.mjs
      - name: V2 M2 native cancel and resume race is single-winner
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
