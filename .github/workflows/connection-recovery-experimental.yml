      - name: V2 F3 managed room Seat Registry credential and session isolation
        run: node --test tests/v2-managed-room-seat-registry.mjs
      - name: Guest-seat registry tests
        run: node tools/connection-recovery/test-seat-registry.js
      - name: V2 F4 final real Chromium Seat Registry action repeat
        shell: bash
        run: |
          browser=""
          for candidate in /usr/bin/google-chrome /usr/bin/chromium /usr/bin/chromium-browser; do
