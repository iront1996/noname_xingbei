name: Experimental connection recovery tests

on:
  push:
    branches:
      - feature/connection-health-recovery
      - feature/v2-connection-stability
  pull_request:
    branches:
      - feature/v2-connection-stability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client recovery and host choice tests
        run: node --test tests/connection-recovery.mjs tests/connection-recovery-b3.mjs tests/connection-recovery-c1.mjs tests/connection-recovery-c2.mjs tests/connection-recovery-c3.mjs tests/connection-recovery-c3b.mjs tests/connection-recovery-c3c.mjs
      - name: V2 patched HALL WebSocket takeover integration
        run: node --test tests/v2-b2-hall-integration.mjs
      - name: V2 offline preflight and stale lobby close guards
        run: node --test tests/v2-hall-preflight.mjs tests/v2-lobby-stale-close.mjs
      - name: V2 independent HALL liveness and game-progress observer
        run: node --test tests/v2-hall-progress-watch.mjs
      - name: V2 advisory game-progress and stalled-choice diagnostics
        run: node --test tests/v2-progress-audit.mjs
      - name: V2 scoped Xingbei own-seat poison skill recovery
        run: node --test tests/v2-skill-resume.mjs
      - name: V2 snapshot coverage and unsnapshotted GameEvent disclosure
        run: node --test tests/v2-reinit-coverage.mjs
      - name: V2 async snapshot generation and roster structural validation
        run: node --test tests/v2-reinit-async-fence.mjs
      - name: V2 host and guest reinit readiness handshake
        run: node --test tests/v2-host-reinit-handshake.mjs
      - name: V2 seat reclaim and reinit safety gates
        run: node --test tests/v2-recovery-gate.mjs
      - name: V2 server-owned room lifecycle foundation
        run: node --test tests/v2-server-room-lifecycle.mjs
      - name: V2 owner browser recovery protocol
        run: node --test tests/v2-owner-recovery.mjs tests/v2-owner-client-events.mjs
      - name: Install isolated WebSocket test dependency
        run: npm install --prefix "$RUNNER_TEMP/xingbei-ws" --ignore-scripts --no-save ws@8.18.3
      - name: V2 real HALL WebSocket process lifecycle
        env:
          NODE_PATH: ${{ runner.temp }}/xingbei-ws/node_modules
        run: node --test tests/v2-hall-process-integration.mjs
      - name: V2 generated B2 and M1 same-process integration
        env:
          NODE_PATH: ${{ runner.temp }}/xingbei-ws/node_modules
        run: node --test tests/v2-b2-m1-process-integration.mjs
      - name: Guest-seat registry tests
        run: node tools/connection-recovery/test-seat-registry.js
