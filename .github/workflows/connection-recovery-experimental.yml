name: Experimental connection recovery tests

on:
  push:
    branches:
      - feature/connection-health-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client recovery and host choice tests
        run: node --test tests/connection-recovery.mjs tests/connection-recovery-b3.mjs tests/connection-recovery-c1.mjs
      - name: Guest-seat registry tests
        run: node tools/connection-recovery/test-seat-registry.js
