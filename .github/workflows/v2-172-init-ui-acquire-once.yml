name: V2 isolated final public init and UI runtime acquisition (one-time)
on:
  push:
    branches:
      - integration/v2-172-public-tutorial-reconcile-20261120
permissions:
  contents: write
jobs:
  import-two-pinned-original-sources:
    if: github.repository == 'iront1996/noname_xingbei'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate V2 baseline, upstream and isolated context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'integration/v2-172-public-tutorial-reconcile-20261120'
          test "$(git ls-remote origin refs/heads/feature/image-preload-cache | cut -f1)" = f0510164518037dda1c330849dd6754d10ca1b19
          test "$(git ls-remote https://github.com/RancherJie/noname_xingbei.git refs/heads/master | cut -f1)" = 27ad858dbeea5da35fc434cc226b0302792d2ba3
          test -z "$(git status --porcelain)"
      - name: Fetch SHA256-pinned exact original website tutorial-init/UI sources
        shell: bash
        run: |
          set -euo pipefail
          for p in noname/init/index.js noname/ui/create/index.js; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 40 \
              "https://rancherjie.github.io/noname_xingbei/$p?original=$GITHUB_SHA" -o "$p"
            test -s "$p"
            test "$(wc -c < "$p")" -lt 300000
            node --check "$p"
          done
          printf '%s\n' \
            '48303f56b740bb5349d1c52f7d006f5780e6d61a98de87aa1b28497af8ec2836  noname/init/index.js' \
            '99735fcfd75b3bcd3428d3513a7ddb78ba4f3c9fd1df01856639f376163ec59d  noname/ui/create/index.js' \
            | sha256sum -c -
          git add -u -- noname/init/index.js noname/ui/create/index.js
          git -c core.quotePath=false diff --cached --name-only | LC_ALL=C sort > /tmp/v2-pinned-two.txt
          printf '%s\n' noname/init/index.js noname/ui/create/index.js > /tmp/v2-pinned-two-expected.txt
          diff -u /tmp/v2-pinned-two-expected.txt /tmp/v2-pinned-two.txt
          test -z "$(git diff --name-only)"
          echo 'V2_ORIGINAL_PUBLISHED_INIT_AND_UI_SHA256_PINNED_PASS'
      - name: Commit only two SHA256-pinned official assets to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V2 Public Origin Source Integrity'
          git config user.email 'v2-source-integrity@users.noreply.github.com'
          git commit -m 'sync(v2): inherit pinned original published tutorial initialization and UI source'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo 'V2_ORIGINAL_INIT_UI_COMMITTED_TO_ISOLATION_ONLY'
